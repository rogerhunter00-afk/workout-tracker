name: Improve Strongroom sync reliability

on:
  push:
    paths:
      - 'scripts/improve_sync_once.py'
      - '.github/workflows/improve-strongroom-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index only
        run: python scripts/improve_sync_once.py
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text()
          blocks = re.findall(r'<script>(.*?)</script>', s, re.S)
          if not blocks:
              raise SystemExit('No inline script found')
          Path('/tmp/strongroom.js').write_text(blocks[-1])
          PY
          node --check /tmp/strongroom.js
          git diff --check
      - name: Commit code-only fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve automatic GitHub backup reliability"
          git push
