name: Improve Strongroom sync reliability

on:
  push:
    paths:
      - '.github/workflows/improve-strongroom-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch sync logic without touching workout data
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          def repl(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'Expected block not found: {label}')
              if s.count(old) != 1:
                  raise SystemExit(f'Expected exactly one block for {label}, found {s.count(old)}')
              s = s.replace(old, new, 1)

          repl('''    <div id="bkConnected" style="display:none">
      <p class="muted" id="bkStatus" style="margin-bottom:14px"></p>
      <div class="btn-row">
        <button class="btn btn-ghost" id="syncNow">Sync now</button>
        <button class="btn btn-ghost" id="disconnectBtn">Disconnect</button>
      </div>
    </div>''', '''    <div id="bkConnected" style="display:none">
      <p class="muted" id="bkStatus" style="margin-bottom:14px"></p>
      <div class="btn-row">
