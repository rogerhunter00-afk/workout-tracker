name: Add Strongroom multi-user profiles

on:
  push:
    paths:
      - '.github/workflows/add-strongroom-multiuser.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply code-only multi-user update
        run: python scripts/add_multiuser_personalisation_once.py
      - name: Validate inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          a=s.index('<script>')+len('<script>')
          b=s.rindex('</script>')
          Path('/tmp/strongroom.js').write_text(s[a:b])
          PY
          node --check /tmp/strongroom.js
      - name: Ensure workout archive was not changed
        run: git diff --exit-code -- data.json
      - name: Commit multi-user Strongroom
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add multi-user profiles and theme customisation'
          git push
