name: Keep Strongroom Supabase active

on:
  schedule:
    - cron: '17 6,14,22 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/keep-strongroom-supabase-active.yml'

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Send read-only database heartbeat
        env:
          SUPABASE_URL: https://hkxgkbdrazktzmuujeqq.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_0Su_8qOrteBTkEdLxCWDbA_9Ez-N-IT
        run: |
          curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/strongroom_keepalive?select=id&limit=1" \
            > /dev/null
